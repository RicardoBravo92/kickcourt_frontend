<div class="min-h-screen flex items-center justify-center py-12 px-4">
  <div class="max-w-md w-full space-y-8">
    <div class="text-center">
      <h2 class="text-3xl font-bold text-gray-900">{{ 'auth.loginTitle' | translate }}</h2>
      <p class="mt-2 text-sm text-gray-600">{{ 'auth.loginSubtitle' | translate }}</p>
    </div>

    @if (error) {
      <div class="bg-red-50 border border-red-300 text-red-700 px-4 py-3 rounded-md text-sm">
        {{ error | translate }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="mt-8 space-y-6">
      <div class="space-y-4">
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700">{{ 'auth.username' | translate }}</label>
          <input id="username" type="text" [(ngModel)]="credentials.username" name="username" required
                 placeholder="{{ 'auth.usernameOrEmail' | translate }}"
                 class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500" />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">{{ 'auth.password' | translate }}</label>
          <input id="password" type="password" [(ngModel)]="credentials.password" name="password" required
                 class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500" />
        </div>
      </div>

      <button type="submit" [disabled]="loading"
              class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 disabled:opacity-50">
        @if (loading) { {{ 'auth.loggingIn' | translate }} } @else { {{ 'auth.loginBtn' | translate }} }
      </button>

      <p class="text-center text-sm text-gray-600">
        {{ 'auth.noAccount' | translate }}
        <a routerLink="/register" class="font-medium text-green-600 hover:text-green-500 ml-1">{{ 'auth.signUp' | translate }}</a>
      </p>
    </form>
  </div>
</div>
