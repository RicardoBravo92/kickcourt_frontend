<div class="min-h-screen flex items-center justify-center py-12 px-4">
  <div class="max-w-md w-full space-y-8">
    <div class="text-center">
      <h2 class="text-3xl font-bold text-gray-900">Olvidé mi contraseña</h2>
      <p class="mt-2 text-sm text-gray-600">Ingresa tu email para recibir un enlace de recuperación</p>
    </div>

    @if (success) {
      <div class="bg-green-50 border border-green-300 text-green-700 px-4 py-3 rounded-md text-sm">
        {{ success }}
      </div>
    }

    @if (error) {
      <div class="bg-red-50 border border-red-300 text-red-700 px-4 py-3 rounded-md text-sm">
        {{ error }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="mt-8 space-y-6">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" required
               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500" />
      </div>

      <button type="submit" [disabled]="loading"
              class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 disabled:opacity-50">
        @if (loading) { Cargando... } @else { Enviar enlace }
      </button>

      <p class="text-center text-sm text-gray-600">
        <a routerLink="/login" class="font-medium text-green-600 hover:text-green-500">Volver al login</a>
      </p>
    </form>
  </div>
</div>
