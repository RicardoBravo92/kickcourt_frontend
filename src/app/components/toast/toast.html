<div class="fixed top-4 right-4 z-50 space-y-2">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast-item max-w-sm w-full shadow-lg rounded-lg p-4 flex items-center gap-3"
         [class]="{
           'bg-green-50 border border-green-200 text-green-800': toast.type === 'success',
           'bg-red-50 border border-red-200 text-red-800': toast.type === 'error',
           'bg-blue-50 border border-blue-200 text-blue-800': toast.type === 'info'
         }">
      <span class="text-lg">
        @if (toast.type === 'success') { ✓ }
        @else if (toast.type === 'error') { ✗ }
        @else { ℹ }
      </span>
      <p class="text-sm font-medium flex-1">{{ toast.message }}</p>
      <button (click)="toastService.dismiss(toast.id)" class="text-gray-400 hover:text-gray-600">✕</button>
    </div>
  }
</div>
